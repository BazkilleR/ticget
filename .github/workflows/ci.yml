name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Same stack as local dev: postgres (+ tickets_test via init script), redis, localstack (+ SQS queues).
      - name: Start infrastructure
        run: docker compose up -d --wait

      # .env.example only holds local/LocalStack values, no real secrets.
      - name: Create .env
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Migrate and seed dev database
        run: npm run migrate && npm run seed

      - name: Test
        run: npm test

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
